[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-pydantic-bridge-demo"
version = "0.3.0"
description = "Proof of concept: native generated Protobuf messages as Pydantic v2 types"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "protobuf>=5,<8"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27", "grpcio>=1.65"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "grpcio>=1.65", "grpcio-tools>=1.65", "httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "uvicorn>=0.54.0",
]
